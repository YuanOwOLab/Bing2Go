name: Discord Notifications (Embed)

on:
    push:
        branches: [main, dev]

    pull_request:
        types: [opened, closed, reopened, synchronize]

    pull_request_review:
        types: [submitted]

    issues:
        types: [opened, closed, reopened]

    issue_comment: # 包含 PR comments
        types: [created]

    watch:
        types: [started]

    fork:

jobs:
    notify:
        runs-on: ubuntu-latest

        steps:
            - name: Send embed to Discord
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
                  EVENT: ${{ github.event_name }}
                  ACTOR: ${{ github.actor }}
                  AVATAR_URL: https://github.com/${{ github.actor }}.png
              run: |
                  EVENT_PATH="$GITHUB_EVENT_PATH"

                  json_get() {
                    jq -r "$1 // \"\"" "$EVENT_PATH"
                  }

                  # Detect event type and construct embed content
                  case "$EVENT" in

                    push)
                      COLOR=3066993   # green
                      TITLE="🚀 Push to ${GITHUB_REF##*/}"
                      DESC="$(json_get '.head_commit.message')"
                      URL="$(json_get '.head_commit.url')"
                      FOOT="commit $(json_get '.head_commit.id')"
                      ;;

                    pull_request)
                      PR_ACTION="$(json_get '.action')"
                      PR_MERGED="$(json_get '.pull_request.merged')"
                      if [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
                        COLOR=10181046  # purple
                        TITLE="🟣 Pull Request Merged"
                      else
                        case "$PR_ACTION" in
                          opened)     COLOR=3066993;  TITLE="🟢 PR Opened" ;;
                          closed)     COLOR=15158332; TITLE="🔴 PR Closed" ;;
                          reopened)   COLOR=15844367; TITLE="🟡 PR Reopened" ;;
                          synchronize) COLOR=3447003; TITLE="🔄 PR Updated" ;;
                        esac
                      fi
                      TITLE="$TITLE: $(json_get '.pull_request.title')"
                      DESC="$(json_get '.pull_request.body')"
                      URL="$(json_get '.pull_request.html_url')"
                      FOOT="Pull Request #$(json_get '.pull_request.number')"
                      ;;

                    pull_request_review)
                      COLOR=3447003  # blue
                      TITLE="📝 PR Review: $(json_get '.pull_request.title')"
                      DESC="$(json_get '.review.body')"
                      URL="$(json_get '.review.html_url')"
                      FOOT="Pull Request #$(json_get '.pull_request.number')"
                      ;;

                    issues)
                      case "$(json_get '.action')" in
                        opened) COLOR=3066993; TITLE="🟢 Issue Opened" ;;
                        closed) COLOR=15158332; TITLE="🔴 Issue Closed" ;;
                        reopened) COLOR=15844367; TITLE="🟡 Issue Reopened" ;;
                      esac
                      TITLE="$TITLE: $(json_get '.issue.title')"
                      DESC="$(json_get '.issue.body')"
                      URL="$(json_get '.issue.html_url')"
                      FOOT="Issue #$(json_get '.issue.number')"
                      ;;

                    issue_comment)
                      COLOR=3447003
                      TITLE="💬 New Comment on Issue#$(json_get '.issue.number')"
                      DESC="$(json_get '.comment.body')"
                      URL="$(json_get '.comment.html_url')"
                      FOOT="Issue #$(json_get '.issue.number')"
                      ;;

                    watch)
                      COLOR=15844367
                      TITLE="⭐ Repo Starred"
                      DESC="**User:** $ACTOR"
                      URL=""
                      FOOT="${GITHUB_REPOSITORY}"
                      ;;

                    fork)
                      COLOR=15105570
                      TITLE="🍴 Repo Forked"
                      DESC="**User:** $ACTOR"
                      URL=""
                      FOOT="${GITHUB_REPOSITORY}"
                      ;;

                    *)
                      COLOR=8359053
                      TITLE="📣 Event Triggered"
                      DESC="$EVENT event triggered."
                      URL=""
                      FOOT="${GITHUB_REPOSITORY}"
                      ;;
                  esac

                  # Escape fields safely
                  SAFE_TITLE=$(printf '%s' "$TITLE" | jq -Rs .)
                  SAFE_DESC=$(printf '%s' "$DESC" | jq -Rs .)
                  SAFE_URL=$(printf '%s' "$URL" | jq -Rs .)
                  SAFE_FOOT=$(printf '%s' "$FOOT" | jq -Rs .)
                  SAFE_ACTOR=$(printf '%s' "$ACTOR" | jq -Rs .)
                  SAFE_AVATAR=$(printf '%s' "$AVATAR_URL" | jq -Rs .)

                  # Build embed JSON
                  JSON=$(cat <<EOF
                  {
                    "embeds": [
                      {
                        "author": {
                            "name": $SAFE_ACTOR,
                            "icon_url": $SAFE_AVATAR
                        },
                        "title": $SAFE_TITLE,
                        "description": $SAFE_DESC,
                        "url": $SAFE_URL,
                        "color": $COLOR,
                        "footer": {
                          "text": $SAFE_FOOT
                        },
                        "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      }
                    ]
                  }
                  EOF
                  )

                  # Send to Discord
                  curl -H "Content-Type: application/json" \
                       -d "$JSON" \
                       "$DISCORD_WEBHOOK"
